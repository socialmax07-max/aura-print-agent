<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operator Dashboard — Aura Print</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="/firebase-config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#0f172a;color:#f8fafc;padding:16px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;background:#1e293b;padding:16px;border-radius:12px;margin-bottom:20px;border:1px solid #334155}
.order-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.token{font-size:1.3rem;font-weight:800;color:#38bdf8}
.btn-print{background:#2563eb;color:#fff;padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:700;border:none;cursor:pointer}
</style>
</head>
<body>
<div style="max-width:800px;margin:0 auto">
  <div class="header">
    <div>
      <h2 id="opShopName">Operator Terminal</h2>
      <p style="color:#94a3b8;font-size:0.85rem">Live Print Queue for <b id="opShopCode" style="color:#38bdf8">---</b></p>
    </div>
    <div style="background:#10b981;color:#fff;font-size:0.75rem;padding:6px 10px;border-radius:6px;font-weight:700">LIVE SYNC ON</div>
  </div>

  <h3 style="margin-bottom:12px">आने वाले प्रिंट ऑर्डर्स (Live Queue)</h3>
  <div id="ordersList">
    <div style="text-align:center;padding:40px;color:#64748b">ऑर्डर्स का इंतज़ार है... Customer Kiosk से फाइल भेजते ही यहाँ दिखाई देगी।</div>
  </div>
</div>

<script>
const urlP = new URLSearchParams(window.location.search);
const shopId = urlP.get('shop') || 'shop1';
document.getElementById('opShopCode').innerText = shopId;

db.collection('shops').doc(shopId).get().then(doc => {
  if(doc.exists) document.getElementById('opShopName').innerText = doc.data().name;
});

// Real-time Cloud sync: Customer ke submit karte hi bina refresh kiye yahan aayega
db.collection('orders').where('shopId', '==', shopId).orderBy('createdAt', 'desc')
  .onSnapshot(snapshot => {
    const list = document.getElementById('ordersList');
    if (snapshot.empty) {
      list.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b">कोई पेंडिंग आर्डर नहीं है।</div>';
      return;
    }
    list.innerHTML = snapshot.docs.map(doc => {
      const o = doc.data();
      return `
        <div class="order-card">
          <div>
            <div class="token">${o.token}</div>
            <strong style="color:#fff">${o.fileName}</strong>
            <div style="font-size:0.8rem;color:#94a3b8;margin-top:4px">${o.mode} | ${o.copies} Copy</div>
          </div>
          <div>
            ${o.fileUrl ? `<a href="${o.fileUrl}" target="_blank" class="btn-print">📥 Download & Print</a>` : `<span style="color:#f59e0b;font-size:0.85rem">Direct File</span>`}
          </div>
        </div>
      `;
    }).join('');
  });
</script>
</body>
</html>
