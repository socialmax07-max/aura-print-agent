<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76" fill="none">
  <defs>
    <!-- Brand Gradient: Deep Royal Blue to Electric Azure -->
    <linearGradient id="auraBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Aura Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic Base Gradient -->
    <linearGradient id="printerBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Paper Gradient -->
    <linearGradient id="paperSheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- ==================== EMBLEM (PRINTER + AURA WAVES) ==================== -->
  <g transform="translate(6, 6)">
    <!-- Outer Aura Radiant Ring -->
    <circle cx="32" cy="32" r="30" fill="url(#auraBrandGrad)" opacity="0.12" />
    <circle cx="32" cy="32" r="28" stroke="url(#auraBrandGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" />

    <!-- Top Paper Feed Slot & Incoming Sheet -->
    <path d="M 20 18 L 44 18 L 41 8 C 41 6.8 40.1 6 39 6 L 25 6 C 23.9 6 23 6.8 23 8 Z" fill="url(#paperSheetGrad)" stroke="#cbd5e1" stroke-width="1" />
    <!-- Paper lines -->
    <line x1="26" y1="10" x2="38" y2="10" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="26" y1="13" x2="35" y2="13" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />

    <!-- Main Printer Chassis / Body -->
    <rect x="12" y="18" width="40" height="24" rx="4" fill="url(#printerBodyGrad)" />
    
    <!-- Printer Front Accent Strip & Status LED -->
    <rect x="15" y="22" width="34" height="4" rx="1.5" fill="#1e293b" />
    <circle cx="45" cy="24" r="1.5" fill="#22c55e" filter="url(#softGlow)" />

    <!-- Paper Output Tray & Emerging Document -->
    <path d="M 17 32 L 47 32 L 44 46 C 44 47.1 43.1 48 42 48 L 22 48 C 20.9 48 20 47.1 20 46 Z" fill="#1e293b" />
    
    <!-- Emerging Printed Page -->
    <rect x="22" y="28" width="20" height="24" rx="1.5" fill="#ffffff" stroke="#93c5fd" stroke-width="1" />
    <!-- Cyan Print lines (Simulating print laser/inkhead) -->
    <line x1="25" y1="33" x2="39" y2="33" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" />
    <line x1="25" y1="37" x2="36" y2="37" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="25" y1="41" x2="39" y2="41" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" />
    <line x1="25" y1="45" x2="32" y2="45" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" />

    <!-- Radiant Dynamic Print Beam -->
    <circle cx="32" cy="38" r="1" fill="#38bdf8" filter="url(#softGlow)" />
  </g>

  <!-- ==================== BRAND TYPOGRAPHY ==================== -->
  <g transform="translate(80, 16)">
    <!-- Primary "AURA" Wordmark -->
    <text x="0" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" letter-spacing="0.04em" fill="#0f172a">
      AURA
    </text>

    <!-- Gradient Accent Dot -->
    <circle cx="95" cy="18" r="3.5" fill="url(#auraBrandGrad)" />

    <!-- Subtitle / Tagline: "PRINT PRO" -->
    <text x="1" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.22em" fill="#2563eb">
      PRINT PRO
    </text>

    <!-- Certified Badge Tag -->
    <rect x="110" y="16" width="48" height="18" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="134" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle" letter-spacing="0.05em">
      SAAS
    </text>
  </g>
</svg>
